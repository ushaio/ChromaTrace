name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-universal:
    name: Build Universal macOS bundle
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build Universal macOS app and DMG
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Archive macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ChromaTrace.app \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ChromaTrace.app.zip

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: ChromaTrace-macOS-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
