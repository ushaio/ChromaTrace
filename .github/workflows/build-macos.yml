name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-universal:
    name: Build Universal macOS bundle
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build Universal macOS app and DMG
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Archive macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ChromaTrace.app \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ChromaTrace.app.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromaTrace-macOS-universal-${{ env.RELEASE_TAG }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish bundles to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ChromaTrace ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
